name: Update profile stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/profile-preview]
    paths:
      - profile-terminal-goku.svg
      - scripts/update_profile_stats.py
      - tests/test_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/profile-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test stats collection and SVG rendering
        run: python3 -m unittest discover -s tests -p test_profile_stats.py
      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_profile_stats.py
      - name: Commit changed stats
        run: |
          git add -- profile-terminal-goku.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile stats'
          git pull --rebase
          git push
